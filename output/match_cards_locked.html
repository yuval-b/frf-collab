<meta charset="utf-8">
<title>Forrest Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f6f3ea;
    --paper-raised: #fffdf7;
    --ink: #1e2a20;
    --ink-soft: #4b5648;
    --moss: #4b6b4a;
    --moss-deep: #2c4227;
    --amber: #a8752e;
    --line: #ddd6c3;
    --line-strong: #c9c0a6;
    --shadow: 30 20% 10%;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12160e;
      --paper-raised: #191f13;
      --ink: #e9e6d9;
      --ink-soft: #b3ae9c;
      --moss: #93c08f;
      --moss-deep: #bfe0b9;
      --amber: #dfa75d;
      --line: #2c3323;
      --line-strong: #3b4430;
      --shadow: 100 15% 2%;
    }
  }

  :root[data-theme="dark"] {
    --paper: #12160e;
    --paper-raised: #191f13;
    --ink: #e9e6d9;
    --ink-soft: #b3ae9c;
    --moss: #93c08f;
    --moss-deep: #bfe0b9;
    --amber: #dfa75d;
    --line: #2c3323;
    --line-strong: #3b4430;
    --shadow: 100 15% 2%;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  h1, h2, h3 { text-wrap: balance; font-family: "Fraunces", Georgia, serif; }

  .mono {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  /* ---------- Lock screen ---------- */

  #lock-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }

  .lock-card {
    width: 100%;
    max-width: 380px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2.25rem 2rem 2rem;
    box-shadow: 0 1px 2px hsl(var(--shadow) / 0.06), 0 12px 32px -16px hsl(var(--shadow) / 0.25);
  }

  .lock-mark {
    width: 40px;
    height: 40px;
    margin: 0 auto 1.25rem;
    color: var(--moss);
    display: block;
  }

  .lock-card h1 {
    margin: 0 0 0.35rem;
    font-size: 1.5rem;
    font-weight: 600;
    text-align: center;
    color: var(--ink);
  }

  .lock-card p {
    margin: 0 0 1.75rem;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.92rem;
    line-height: 1.5;
  }

  .field-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }

  #password {
    width: 100%;
    font: inherit;
    font-size: 1rem;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
  }

  #password:focus-visible,
  #unlock-btn:focus-visible,
  #search:focus-visible {
    outline: 2px solid var(--moss);
    outline-offset: 2px;
  }

  #unlock-btn {
    margin-top: 1rem;
    width: 100%;
    font: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.7rem 0.8rem;
    border: none;
    border-radius: 3px;
    background: var(--moss-deep);
    color: var(--paper-raised);
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #unlock-btn { color: #10160c; }
  }
  :root[data-theme="dark"] #unlock-btn { color: #10160c; }

  #unlock-btn:hover { filter: brightness(1.08); }
  #unlock-btn:disabled { opacity: 0.6; cursor: progress; }

  #lock-error {
    margin-top: 0.9rem;
    font-size: 0.85rem;
    color: #a8432f;
    text-align: center;
    min-height: 1.2em;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #lock-error { color: #e0876f; }
  }
  :root[data-theme="dark"] #lock-error { color: #e0876f; }

  /* ---------- Content ---------- */

  #content { display: flex; flex-direction: column; flex: 1; }

  #content[hidden] { display: none; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 1rem 1.5rem;
  }

  .topbar-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .topbar h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
  }

  .topbar .count {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .search-row {
    max-width: 760px;
    margin: 0.9rem auto 0;
  }

  #search {
    width: 100%;
    font: inherit;
    font-size: 0.95rem;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    background: var(--paper-raised);
    color: var(--ink);
  }

  main {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 1.75rem 1.5rem 4rem;
    flex: 1;
  }

  .person {
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper-raised);
    padding: 1.5rem 1.6rem 1.6rem;
    margin-bottom: 1.1rem;
  }

  .person-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.9rem;
    margin-bottom: 1rem;
  }

  .person-head h2 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }

  .person-head .inst {
    font-size: 0.82rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .matches { display: flex; flex-direction: column; gap: 0.9rem; }

  .match {
    display: grid;
    grid-template-columns: 1.6rem 1fr auto;
    column-gap: 0.7rem;
    row-gap: 0.25rem;
    align-items: baseline;
  }

  .match .rank {
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .match .m-name {
    font-weight: 600;
    color: var(--ink);
  }

  .match .m-inst {
    font-size: 0.8rem;
    color: var(--ink-soft);
    font-style: italic;
    margin-left: 0.4rem;
  }

  .match .score {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.15rem 0.45rem;
    border-radius: 999px;
    background: color-mix(in srgb, var(--amber) 16%, transparent);
    color: var(--amber);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .match .rationale {
    grid-column: 2 / 4;
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--ink-soft);
    border-left: 2px solid var(--line-strong);
    padding-left: 0.7rem;
    margin: 0;
  }

  .no-results {
    text-align: center;
    color: var(--ink-soft);
    padding: 3rem 1rem;
    font-size: 0.95rem;
  }

  @media (prefers-reduced-motion: no-preference) {
    .person { animation: rise 0.25s ease both; }
    .person:nth-of-type(n+8) { animation-duration: 0s; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }
</style>

<div id="lock-screen">
  <form class="lock-card" id="lock-form" autocomplete="off">
    <svg class="lock-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      <path d="M24 20 V44" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M24 27 L18 22 M24 31 L30 26" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <h1>Forrest Field Notes</h1>
    <p>Match notes from the networking event.<br>Enter the password to read them.</p>
    <label class="field-label" for="password">Password</label>
    <input id="password" name="password" type="password" required autofocus>
    <button id="unlock-btn" type="submit">Unlock</button>
    <div id="lock-error" role="alert"></div>
  </form>
</div>

<div id="content" hidden>
  <div class="topbar">
    <div class="topbar-inner">
      <h1>Forrest Field Notes</h1>
      <span class="count" id="person-count"></span>
    </div>
    <div class="search-row">
      <input id="search" type="search" placeholder="Find a name...">
    </div>
  </div>
  <main id="cards"></main>
</div>

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function decryptPayload(password) {
    const enc = new TextEncoder();
    const salt = b64ToBytes(PAYLOAD.salt);
    const iv = b64ToBytes(PAYLOAD.iv);
    const ciphertext = b64ToBytes(PAYLOAD.ciphertext);

    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: PAYLOAD.iterations, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
    return new TextDecoder().decode(plainBuf);
  }

  function parsePeople(text) {
    const blocks = text.split(/\n-{3,}\s*\n/).map(b => b.trim()).filter(Boolean);
    return blocks.map(block => {
      const lines = block.split("\n");
      let idx = 0;
      const name = (lines[idx++] || "").replace(/^#\s*/, "").trim();
      const institution = (lines[idx++] || "").replace(/^\*/, "").replace(/\*$/, "").trim();
      const matches = [];
      while (idx < lines.length) {
        const line = lines[idx];
        const head = line.match(/^\*\*(.+?)\*\*\s*\u2014\s*\*(.*)\*\s*$/);
        if (head) {
          const mName = head[1].trim();
          const mInst = head[2].trim();
          idx++;
          while (idx < lines.length && lines[idx].trim() === "") idx++;
          let score = null;
          const scoreLine = (lines[idx] || "").match(/Score:\s*([\d.]+)/);
          if (scoreLine) { score = parseFloat(scoreLine[1]); idx++; }
          while (idx < lines.length && lines[idx].trim() === "") idx++;
          let rationale = "";
          if (lines[idx] && lines[idx].trim().startsWith(">")) {
            rationale = lines[idx].trim().replace(/^>\s*/, "");
            idx++;
          }
          matches.push({ name: mName, institution: mInst, score, rationale });
        } else {
          idx++;
        }
      }
      return { name, institution, matches };
    }).filter(p => p.name);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function renderPeople(people) {
    const cards = document.getElementById("cards");
    const countEl = document.getElementById("person-count");
    countEl.textContent = people.length + (people.length === 1 ? " person" : " people");

    function draw(filterText) {
      const q = filterText.trim().toLowerCase();
      const filtered = q
        ? people.filter(p => p.name.toLowerCase().includes(q))
        : people;

      cards.innerHTML = "";
      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "no-results";
        empty.textContent = "No one matches \u201c" + filterText + "\u201d.";
        cards.appendChild(empty);
        return;
      }

      for (const p of filtered) {
        const card = document.createElement("article");
        card.className = "person";

        const head = document.createElement("div");
        head.className = "person-head";
        head.innerHTML =
          "<h2>" + escapeHtml(p.name) + "</h2>" +
          (p.institution ? "<span class=\"inst\">" + escapeHtml(p.institution) + "</span>" : "");
        card.appendChild(head);

        const list = document.createElement("div");
        list.className = "matches";
        p.matches.forEach((m, i) => {
          const row = document.createElement("div");
          row.className = "match";
          row.innerHTML =
            "<span class=\"rank mono\">" + (i + 1) + "</span>" +
            "<span><span class=\"m-name\">" + escapeHtml(m.name) + "</span>" +
            (m.institution ? "<span class=\"m-inst\">" + escapeHtml(m.institution) + "</span>" : "") + "</span>" +
            (m.score !== null ? "<span class=\"score mono\">" + m.score.toFixed(2) + "</span>" : "<span></span>") +
            (m.rationale ? "<p class=\"rationale\">" + escapeHtml(m.rationale) + "</p>" : "");
          list.appendChild(row);
        });
        card.appendChild(list);
        cards.appendChild(card);
      }
    }

    draw("");
    document.getElementById("search").addEventListener("input", e => draw(e.target.value));
  }

  document.getElementById("lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("unlock-btn");
    const errEl = document.getElementById("lock-error");
    const pw = document.getElementById("password").value;
    btn.disabled = true;
    errEl.textContent = "";
    try {
      const text = await decryptPayload(pw);
      const people = parsePeople(text);
      document.getElementById("lock-screen").remove();
      document.getElementById("content").hidden = false;
      renderPeople(people);
    } catch (err) {
      errEl.textContent = "Wrong password \u2014 nothing was decrypted.";
      btn.disabled = false;
    }
  });
</script>
